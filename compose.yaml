services:
  redis:
    image: redis:7
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: botguard
      RABBITMQ_DEFAULT_PASS: botguard-pass
    ports: [ "15672:15672" ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botguard
    ports: [ "5432:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d botguard" ]
      interval: 5s
      timeout: 3s
      retries: 5

  target-site:
    image: nginx:alpine

  gateway:
    build:
      context: .
      dockerfile: src/BotGuard.Gateway/Dockerfile
    ports: [ "5233:8080" ]
    environment:
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "botguard"
      RabbitMq__Password: "botguard-pass"
      ReverseProxy__Clusters__target-website-cluster__Destinations__target-site__Address: "http://target-site:80"
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  banconsumer:
    build:
      context: .
      dockerfile: src/BotGuard.BanConsumer/Dockerfile
    environment:
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=botguard;Username=postgres;Password=postgres;GssEncryptionMode=Disable"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "botguard"
      RabbitMq__Password: "botguard-pass"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata: